name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    # Only the canonical organisation repository has the production
    # self-hosted runner and environment. Forks should not queue a deploy.
    if: github.repository == 'TheFreeCodeSubculture/fcs-site'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    if: github.repository == 'TheFreeCodeSubculture/fcs-site'
    needs: ci
    runs-on: [self-hosted, linux, x64, fcs-deploy]
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Create release
        run: |
          set -euo pipefail
          release="/srv/fcs-api/releases/${GITHUB_SHA}"
          rm -rf "$release"
          mkdir -p "$release"
          cp -a backend/dist "$release/"
          cp -a backend/package.json backend/package-lock.json backend/ecosystem.config.cjs "$release/"
          cp -a backend/migrations "$release/"
          cd "$release"
          npm ci --omit=dev --no-audit --no-fund

      - name: Apply migrations
        run: |
          set -euo pipefail
          cd "/srv/fcs-api/releases/${GITHUB_SHA}"
          FCS_ENV_FILE=/srv/fcs-api/shared/.env node dist/db/migrate.js

      - name: Activate and verify
        run: |
          set -euo pipefail
          release="/srv/fcs-api/releases/${GITHUB_SHA}"
          previous="$(readlink -f /srv/fcs-api/current || true)"
          ln -sfn "$release" /srv/fcs-api/current
          cd /srv/fcs-api/current
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

          # PM2 can return before the app has bound its port. Poll instead
          # of treating "connection refused" as a failed deployment.
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:5050/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            echo "Health check attempt ${attempt}/30 failed; waiting..."
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Health check failed after 30 attempts; rolling back to ${previous:-nothing}"
            if [ -n "$previous" ]; then
              ln -sfn "$previous" /srv/fcs-api/current
              cd /srv/fcs-api/current
              pm2 startOrReload ecosystem.config.cjs --update-env
              pm2 save

              rollback_ok=0
              for attempt in $(seq 1 15); do
                if curl -fsS --max-time 2 http://127.0.0.1:5050/health >/dev/null 2>&1; then
                  rollback_ok=1
                  break
                fi
                sleep 1
              done
              if [ "$rollback_ok" -ne 1 ]; then
                echo "Rollback health check also failed." >&2
              else
                echo "Rollback is healthy."
              fi
            fi
            exit 1
          fi

          echo "Health check passed."
